<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thomas Music" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Thomas Music</title>
    <script type="module" crossorigin src="/assets/index-DAFMeGRY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-hMM0lu8A.css">
  </head>
  <body class="bg-[#0b0d10] text-zinc-100 antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      // Registro de Service Worker para PWA Offline; no aplica dentro de Capacitor.
      if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Thomas Music PWA Service Worker registrado:', reg.scope))
            .catch((err) => console.warn('Fallo registro Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
