<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degrade moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Degradado Audífonos DJ Neón -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Degradado Piel Bebé Suave -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3cf" />
      <stop offset="100%" stop-color="#fcd0b1" />
    </linearGradient>

    <!-- Resplandor Neón -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Marco Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="115" fill="none" stroke="url(#headphoneGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Ondas de Sonido Músicales de fondo -->
  <circle cx="256" cy="275" r="210" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="10 8" />
  <circle cx="256" cy="275" r="175" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.2" />

  <!-- Notas musicales flotantes -->
  <g fill="#06b6d4" opacity="0.85" filter="url(#neonGlow)">
    <!-- Nota izquierda -->
    <path d="M 95 160 L 95 130 C 95 125, 115 120, 125 128 L 125 155" stroke="#06b6d4" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="85" cy="162" r="12" fill="#06b6d4" />
    <circle cx="115" cy="157" r="12" fill="#06b6d4" />
    <line x1="85" y1="130" x2="125" y2="122" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  </g>

  <g fill="#ec4899" opacity="0.85" filter="url(#neonGlow)">
    <!-- Nota derecha -->
    <path d="M 405 150 L 405 120 C 405 115, 420 110, 430 118 L 430 145" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="395" cy="152" r="11" fill="#ec4899" />
    <circle cx="422" cy="147" r="11" fill="#ec4899" />
    <line x1="395" y1="120" x2="430" y2="112" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- DIADEMA DEL AUDÍFONO (Arco Superior detrás del pelo) -->
  <path d="M 140 260 C 140 110, 372 110, 372 260" fill="none" stroke="#1f2430" stroke-width="32" stroke-linecap="round" filter="url(#softShadow)" />
  <path d="M 140 260 C 140 110, 372 110, 372 260" fill="none" stroke="url(#headphoneGrad)" stroke-width="20" stroke-linecap="round" />
  <!-- Almohadilla superior acolchada -->
  <path d="M 195 142 C 220 132, 292 132, 317 142" fill="none" stroke="#2a3040" stroke-width="24" stroke-linecap="round" />

  <!-- CABEZA DEL BEBÉ -->
  <circle cx="256" cy="285" r="115" fill="url(#skinGrad)" filter="url(#softShadow)" />

  <!-- Orejitas tiernas detrás de las almohadillas -->
  <circle cx="152" cy="285" r="26" fill="#fcd0b1" />
  <circle cx="360" cy="285" r="26" fill="#fcd0b1" />

  <!-- Mechas de pelo de bebé tierno (Rizo) -->
  <path d="M 256 170 C 248 140, 276 135, 272 155 C 270 162, 264 168, 256 170 Z" fill="#784421" />
  <path d="M 245 174 C 238 155, 256 150, 252 165 Z" fill="#8d5027" />

  <!-- CEJITAS DE BEBÉ TIERNAS -->
  <path d="M 198 238 C 210 230, 225 232, 230 238" fill="none" stroke="#8d5027" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 314 238 C 302 230, 287 232, 282 238" fill="none" stroke="#8d5027" stroke-width="4.5" stroke-linecap="round" />

  <!-- OJOS GRANDES Y BRILLANTES DE BEBÉ FELIZ -->
  <!-- Ojo Izquierdo -->
  <ellipse cx="212" cy="265" rx="19" ry="24" fill="#261b17" />
  <circle cx="218" cy="256" r="8" fill="#ffffff" />
  <circle cx="206" cy="274" r="3.5" fill="#ffffff" />

  <!-- Ojo Derecho -->
  <ellipse cx="300" cy="265" rx="19" ry="24" fill="#261b17" />
  <circle cx="306" cy="256" r="8" fill="#ffffff" />
  <circle cx="294" cy="274" r="3.5" fill="#ffffff" />

  <!-- MEJILLAS ROSADAS SONROJADAS (BLUSH) -->
  <ellipse cx="185" cy="295" rx="18" ry="11" fill="#ff7f9d" opacity="0.55" />
  <ellipse cx="327" cy="295" rx="18" ry="11" fill="#ff7f9d" opacity="0.55" />

  <!-- NARIZ PEQUEÑITA -->
  <ellipse cx="256" cy="285" rx="5" ry="3.5" fill="#e89e78" />

  <!-- BOCA SONRIENDO CONTENTO ESCUCHANDO MÚSICA -->
  <path d="M 234 308 C 238 335, 274 335, 278 308" fill="#d84860" stroke="#7e1f30" stroke-width="3" stroke-linecap="round" />
  <path d="M 242 312 C 248 322, 264 322, 270 312" fill="#ff7088" />

  <!-- ALMOHADILLAS GRANDES DE AUDÍFONOS DJ (OVER-EAR) -->
  <!-- Almohadilla Izquierda -->
  <g filter="url(#softShadow)">
    <!-- Base externa -->
    <rect x="110" y="220" width="46" height="110" rx="23" fill="#181c26" stroke="#2b3345" stroke-width="3" />
    <!-- Aro Neón -->
    <rect x="116" y="228" width="34" height="94" rx="17" fill="url(#headphoneGrad)" />
    <!-- Centro con logo onda -->
    <rect x="122" y="238" width="22" height="74" rx="11" fill="#0b0d14" />
    <path d="M 127 275 L 133 268 L 137 282 L 141 275" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Almohadilla Derecha -->
  <g filter="url(#softShadow)">
    <!-- Base externa -->
    <rect x="356" y="220" width="46" height="110" rx="23" fill="#181c26" stroke="#2b3345" stroke-width="3" />
    <!-- Aro Neón -->
    <rect x="362" y="228" width="34" height="94" rx="17" fill="url(#headphoneGrad)" />
    <!-- Centro con logo onda -->
    <rect x="368" y="238" width="22" height="74" rx="11" fill="#0b0d14" />
    <path d="M 373 275 L 379 268 L 383 282 L 387 275" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pajarita / Corbatín DJ elegante abajo -->
  <g transform="translate(256, 395)">
    <path d="M -28 -14 L 0 0 L -28 14 Z" fill="url(#headphoneGrad)" />
    <path d="M 28 -14 L 0 0 L 28 14 Z" fill="url(#headphoneGrad)" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- TEXTO ELEGANTE: THOMAS MUSIC -->
  <text x="256" y="458" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    THOMAS
  </text>
  <text x="256" y="488" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="url(#headphoneGrad)" text-anchor="middle" letter-spacing="6">
    MUSIC
  </text>
</svg>
