<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="50%" stop-color="#121820" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vinylRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Vinyl Disc -->
  <circle cx="256" cy="256" r="190" fill="url(#vinylRing)" stroke="#2a2e39" stroke-width="6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1f242d" stroke-width="3" stroke-dasharray="12 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#262c37" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1f242d" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Center Glowing Core -->
  <circle cx="256" cy="256" r="75" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="24" fill="#0b0d10" stroke="#fff" stroke-width="3" />

  <!-- Spotify-like Sound Waves curved -->
  <path d="M 170 190 A 130 130 0 0 1 342 190" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <path d="M 185 225 A 95 95 0 0 1 327 225" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <path d="M 200 260 A 65 65 0 0 1 312 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <!-- Equalizer bars accent at bottom -->
  <rect x="200" y="380" width="12" height="36" rx="6" fill="#10b981" />
  <rect x="224" y="365" width="12" height="51" rx="6" fill="#06b6d4" />
  <rect x="248" y="350" width="12" height="66" rx="6" fill="#10b981" />
  <rect x="272" y="360" width="12" height="56" rx="6" fill="#3b82f6" />
  <rect x="296" y="375" width="12" height="41" rx="6" fill="#10b981" />
</svg>

